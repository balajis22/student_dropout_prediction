version: '3.8'

services:
  fastapi-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_risk_fastapi
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./models:/app/models:ro
      - ./metadata:/app/metadata:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  streamlit-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_performance_dashboard
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - FASTAPI_URL=http://fastapi-service:8000
    volumes:
      - ./dashboard:/app/dashboard
      - ./data:/app/data
      - ./models:/app/models:ro
    depends_on:
      - fastapi-service
    restart: unless-stopped
